[EaglePatch+AC2]
; Improves draw distance for buildings and maxes out draw distance of characters
; Supported values: 0 - off, 1 - on
; Default - 1
ImproveDrawDistance=1

; Improves shadow map resolution from 1024 to 4096 if shadows are maxed out in the settings
; Supported values: 0 - off, 1 - on
; Default - 1
ImproveShadowMapResolution=1

; Keyboard layout that would be used
; Supported values:
;   0 - KeyboardMouse2
;   1 - KeyboardMouse5
;   2 - Keyboard
;   3 - KeyboardAlt
; Default - 0
KeyboardLayout=0

; Swap triggers to bumpers and bumpers to triggers (e.g. R1/RB becomes run button)
; Works for both PS3 and PS4/PS5 layout style controllers
; Supported values: 0 - off, 1 - on
; Default - 0
PS3Controls=0
PS4Controls=0

; Skip videos on game's launch
; Supported values: 0 - off, 1 - on
; Default - 0
SkipIntroVideos=0

; Enable UPlay bonuses
; Supported values: 0 - off, 1 - on
; Default - 1
UPlayItems=1

; Don't patch in the fixes for XInput support to have DirectInput controllers working (not recommended) 
; Supported values: 0 - off, 1 - on
; Default - 0
DisableXInputPatch=0

; Set the process affinity to run on the first four cores (fixes game crashing at startup when using a CPU with a high core count)
; Supported values: 0 - off, 1 - on
; Default - 0
LimitCpuCores=0